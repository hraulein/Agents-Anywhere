# =============================================================================
# Agents Anywhere · 阿里云 Nginx 反向代理配置
#
# 放置位置（Debian/Ubuntu）：
#   /etc/nginx/conf.d/agents-anywhere.conf
# 或 /etc/nginx/sites-enabled/agents-anywhere.conf
#
# 两个占位符必须替换：
#   aa.example.com  → 你的域名
#   100.x.y.z       → N100 的 Tailscale IP
#                     在 N100 上取：docker exec tailscale tailscale ip -4
#
# 一键替换示例（先备份现有配置再执行）：
#   sudo sed -e 's/aa\.example\.com/你的域名/g' -e 's/100\.x\.y\.z/100.64.0.10/g' \
#     agents-anywhere.conf | sudo tee /etc/nginx/conf.d/agents-anywhere.conf
#
# 关于上下文：map 和 upstream 必须写在 http{} 里。nginx.conf 会在 http{} 内部
# include conf.d/*.conf，所以整个文件直接丢进 conf.d 即可，不需要改主配置。
# =============================================================================

# WebSocket 升级头。
# 只在客户端真的发了 Upgrade 时才回 Connection: upgrade，否则回 close。
# 千万不要无条件写死 "Connection upgrade"——那会让所有普通请求都无法复用
# 到上游的连接。
map $http_upgrade $aa_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream agents_anywhere {
    server 100.x.y.z:5174;

    # 若 headscale 配好了 MagicDNS 且本机使用 tailnet DNS，可以改成主机名，
    # 这样 N100 换 IP 也不用改配置：
    #   server n100:5174;
}

# -----------------------------------------------------------------------------
# HTTP → HTTPS
# -----------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name aa.example.com;

    # certbot webroot 方式签证书时用得到；用 nginx 插件签发可删掉。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS 主站
# -----------------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;

    # nginx >= 1.25.1 用这一行；更老的版本请删掉它，并把上面两行改成
    #   listen 443 ssl http2;
    #   listen [::]:443 ssl http2;
    http2 on;

    server_name aa.example.com;

    ssl_certificate     /etc/letsencrypt/live/aa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aa.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 确认 HTTPS 一切正常后再打开 HSTS：
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 【必改】附件上传上限是 5 个文件 × 25MiB。Nginx 默认只有 1m，
    # 不改的话上传附件会直接返回 413，而且前端提示往往很含糊。
    client_max_body_size 160m;

    # 不要缓冲上游响应体。Timeline、会话推送和终端输出都是流式的，
    # 开着 proxy_buffering 会让输出先攒在 Nginx 里，表现为"界面卡住不动"。
    proxy_buffering off;

    # WebSocket 是长连接，默认 60s 空闲超时会把连接掐断，
    # 表现为对话页面隔一会儿就要重连。
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 10s;

    location / {
        # Web 静态站点、REST API 和全部 WebSocket 都挂在同一个源上
        # （API 统一带 /api/v2 前缀），所以整站反代一个 location 就够。
        proxy_pass http://agents_anywhere;
        proxy_http_version 1.1;

        # ---- WebSocket ----
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $aa_connection_upgrade;

        # ---- 转发头：这四行缺一不可 ----
        # 服务端会直接读 X-Forwarded-Proto / X-Forwarded-Host 来拼接绝对 URL
        # （分享链接、OAuth 回调）并判定 Cookie。少传 X-Forwarded-Proto 会生成
        # http:// 地址，典型症状是登录成功后又被弹回登录页。
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
    }
}
